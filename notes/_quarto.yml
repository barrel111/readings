project:
  type: default
  output-dir: _output
  render: 
    - "*.qmd"

format:
  html:
    theme: yeti
    mainfont: EB Garamond

    toc: true
    toc-location: right

    bibliography: references.bib
    
    css: custom.scss

    html-math-method: 
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"

    include-in-header:
      - text: <script src="mathjax-config.js"></script>

number-sections: true

pseudocode:
  caption-number: true

filters:
  - pseudocode
  - thms
